name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

jobs:
  build-ios-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 钉到与本地一致的版本，避免稳定版 API 变更(TabBarTheme→TabBarThemeData)导致编译失败
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r qinglong_app_ios_unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinglong_app_ios_unsigned
          path: qinglong_app_ios_unsigned.ipa
          if-no-files-found: error

      - name: Build for iOS Simulator
        run: flutter build ios --simulator

      - name: Run app on iOS Simulator and take screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/{print $1; exit}' | sed 's/[[:space:]]*$//')
          echo "Using simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE" com.qlapp.qinglongApp
          sleep 20
          xcrun simctl io "$DEVICE" screenshot simulator_screen_1.png
          sleep 5
          xcrun simctl io "$DEVICE" screenshot simulator_screen_2.png

      - name: Upload simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios_simulator_screenshots
          path: |
            simulator_screen_1.png
            simulator_screen_2.png
          if-no-files-found: error
