name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

jobs:
  build-ios-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 钉到与本地一致的版本，避免稳定版 API 变更(TabBarTheme→TabBarThemeData)导致编译失败
          version: '3.29.3'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r qinglong_app_ios_unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinglong_app_ios_unsigned
          path: qinglong_app_ios_unsigned.ipa
          if-no-files-found: error
